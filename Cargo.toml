[package]
name = "ikigai-conformance"
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "What \"done\" means for an ikigai module, as one test: walks every endpoint a kernel binds and reports every violation of the module recipe at once — ArgSpec completeness, requires implies a verb, declared = enforced, declared outputs = served outputs, skolemized RDF faces, vocabulary terms only, the cacheable-twice probe, pipeline citizenship, a space's name is a claim (same name, same doors), every description passes core's own validate, a required input is required and an input group holds, a resolution a check needed resolves, an action fails only with a failure class it states (opt-in) — and says what it did NOT do: what it probed, what it could not, and which of your own declarations reached no check at all."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-conformance"
homepage = "https://github.com/ikigai-rs/ikigai-conformance"
readme = "README.md"
keywords = ["ikigai", "roc", "conformance", "testing", "module"]
categories = ["development-tools::testing"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the module under
# test links, so a host links exactly one `ikigai-core`. 0.1.67 is the API minimum:
# `Kernel::entries()` first listed the kernel's own `urn:kernel:*` operations there
# (#103), and the walk — and the tests that pin how it skips or includes them —
# depend on that shape. Everything else this crate reads (`issue_traced`,
# `describe_pattern`, `TraceEvent::cache_hit`, `Error::Denied`, `InputSource`)
# is older.
#
# 0.1.73 since the purity rule became "no thread but its own name" (ledger #549):
# from 0.1.73 the kernel hangs every cacheable `Source`/`Exists` answer on the
# thread named for its own canonical target, and the rule's exemption for an
# endpoint that takes writes through that name is right only because the kernel's
# auto-cut then reaches the cached read. Below 0.1.73 the exemption would pass a
# read that a write never invalidates. No API changed; the floor is a SEMANTIC one.
#
# 0.1.77 since 0.5.0, TRANSITIVELY: the vocab pin below tracks the head (0.1.84 then), and
# ikigai-vocab 0.1.84 declares `ikigai-core = "0.1.66"` while its lib.rs uses
# `Transreption::lossless` (core 0.1.77), so with core 0.1.73-0.1.76 it does not compile
# (E0609; reported to core as a vocab floor bug). Stating 0.1.77 here keeps a consumer's
# resolve from landing on that pair. Drop back to 0.1.73 once vocab states its own floor.
#
# 0.1.85 since 0.5.1, SEMANTIC again (ledger #756): from 0.1.85 a `requires` declared with
# no verb is enforced on every verb (ledger #750, A3). The REQUIRES-VERB finding's text and
# its test say so, which is true only on 0.1.85+; below it the scope is silently inert.
#
# 0.1.89 since 0.6.0, an API floor (ledger #987): SPACE-NAME calls `space_iri` and reads
# `SPACE_PREFIX`, both new in 0.1.89, which is also the release where binding a door onto
# a named `EndpointSpace` drops its name. Under 0.x caret rules this is the RANGE
# >=0.1.89, <0.2.0: a core 0.2 is a deliberate re-pin here, not a silent float.
#
# 0.1.99 since 0.7.0, SEMANTIC (ledger #1361): VALIDATE calls `Description::validate`,
# which is old, but from 0.1.99 it also refuses a name holding a code point no IRI
# carries (DEL, a C1 control, private use, a noncharacter; ledger #1351). Below it the
# check would pass a name whose Turtle and contract IRIs do not parse. The check
# matches the refusal, never its error variant, so it holds across the core release
# that makes `validate`'s two variants one.
#
# 0.1.100 since 0.7.1, SEMANTIC (ledger #1385): from 0.1.100 core's emitters encode a NAME
# (`encode_name`: `[`, `]`, and every code point no IRI carries) and degrade an authored IRI
# that is not one to a literal, so a description's Meta Turtle parses whatever its names
# hold. The VALIDATE finding's text says so, and `tests/violations.rs` pins an id that is a
# full IRI with an IPv6 host (`http://[::1]/x`): `validate` accepts it AND its Turtle parses,
# which is true only on 0.1.100+. It is also the release where `validate` refuses with one
# error variant; the check still matches the refusal, never the variant.
#
# 0.1.105 since 0.9.0, an API floor (ledger #1547): the suite reads the contract shape
# that release introduced (`InputGroup`, `ArgSpec::needs`/`examples`/`list`/`values`,
# `Arguments`, `OutputFrom`, `ArgSpec::is_enumerated`) and holds REQUIRED's calls to
# core's one checker, `ActionSpec::check` and `ProposedArgs`, all new in 0.1.105. It is
# also the release whose kernel injects a declared default and whose builtins are
# `to-upper` / `reverse-list`, which the tests pin.
#
# 0.1.106 since 0.9.1, SEMANTIC (ledger #1882): from 0.1.106 `validate` accepts a default on
# an OPTIONAL binding (the kernel fills it when the matched name omits the segment, ledger
# #1547) and refuses only a required binding's default. VALIDATE's hint says so, and
# `tests/argspec_shape.rs` pins both halves, which hold only on 0.1.106+.
#
# 0.1.108 since 0.10.0, an API floor (ledger #1546): FAILURES holds every failure the walk
# observes to the action's declaration through core's one predicate,
# `ActionSpec::admits_failure`, and classifies it with `Error::class()` (`FailureClass`,
# `Failures`, `ActionSpec::fails`, `Description::fails`), all new in 0.1.108. It is also the
# release with the four new error variants (`RetryAfter`, `OverBudget`, `Refused`,
# `Unsupported`), which a module's `fails_under` probe can be held to.
#
# 0.2.0 since 0.11.0 (ledger #2261): the streams release. Under 0.x rules "0.1.108" meant
# <0.2.0, so a module on core 0.2.0 linked a second core through this crate and its
# conformance test stopped compiling (ikigai-vocab's did, ledger #2308). Every adopter
# moves with this release.
# 0.2.4 since 0.12.0: BODY-INPUTS reads ArgSpec::reads_body and uses BodyIssue
# to exercise live attachments through the same host kernel (ledger #2457).
ikigai-core = "0.2.4"
# The vocabulary is the ORACLE for the terms check: a predicate is "defined" iff it
# is a subject in `ikigai_vocab::VOCABULARY`. So the floor is the newest published
# vocabulary, not the oldest API this crate compiles against — an older pin would
# report terms that exist as invented.
#
# ⚠ STANDING RULE: **this pin tracks the vocabulary HEAD.** Raise it to the newest
# published `ikigai-vocab` in every release of this crate, whether or not anything
# here changed. It is load-bearing for DATA, not API — the crate uses only `NS` and
# `VOCABULARY`, both ancient, so no compile error will ever force it up and nothing
# will ever say it has gone stale. What a stale pin does instead: cargo unifies
# `ikigai-vocab` across the graph, so a module whose faces use a term the newest
# vocabulary defines fails VOCABULARY ("the vocabulary does not define ns#passcode")
# against a `vocabulary.ttl` that visibly defines it, and the only per-module
# workaround is an `ikigai-vocab` dev-dependency no line imports, added purely to
# lift this floor (ikigai-llm and ikigai-browse both carried one).
#
# 0.2.0: re-checked at release time — 0.1.69 IS the head (ikigai-core's workspace
# version and the newest in the registry index), so the pin stands unchanged.
# 0.4.0: re-checked — 0.1.70 is now the head in the registry index, so the pin is
# raised to it. This crate commits no lockfile, so a fresh resolve already took
# 0.1.70 through the old caret; raising the FLOOR is what stops a consumer with an
# older resolved vocabulary from being told a term it can see is invented.
# 0.5.0: re-checked — 0.1.84 is the head in the registry index; raised to it.
# 0.6.0: re-checked — 0.1.89 is the head in the registry index; raised to it.
# 0.6.1: re-checked — 0.1.91 is the head on crates.io; raised to it. As a caret this is
# the RANGE >=0.1.91, <0.2.0. vocab 0.1.91 itself requires `ikigai-core ^0.1.91`, so
# this pin lifts the core this crate resolves with to 0.1.91 transitively; the
# `ikigai-core` pin above stays at 0.1.89 because that is still the API this crate uses.
# 0.6.2: re-checked — 0.1.96 is the head on crates.io; raised to it (the RANGE >=0.1.96,
# <0.2.0). The core pin stays at 0.1.89 again: `Fixture::capability` takes a
# `Capability`, which is old, and the principal it displays is read as a
# `urn:cap:principal:` scope rather than through core 0.1.93's `Capability::principal`.
# 0.7.0: re-checked — 0.1.99 is the head on crates.io; raised to it (the RANGE >=0.1.99,
# <0.2.0). It now matches the core floor above, which 0.7.0 raised to 0.1.99 for
# VALIDATE.
# 0.7.1: re-checked — 0.1.100 is the head on crates.io; raised to it (the RANGE >=0.1.100,
# <0.2.0). It matches the core floor above again: vocab 0.1.100's `to_turtle` is the
# emitter that calls `encode_name`, so the IPv6-id test needs both.
# 0.8.0: re-checked — 0.1.101 is the head on crates.io; raised to it (the RANGE >=0.1.101,
# <0.2.0). vocab 0.1.101 requires `ikigai-core ^0.1.101`, so this pin lifts the core this
# crate resolves with to 0.1.101 transitively; the `ikigai-core` pin above stays at 0.1.100
# because that is still the API and the semantics this crate uses.
# 0.8.1: re-checked — 0.1.102 is the head on crates.io; raised to it (the RANGE >=0.1.102,
# <0.2.0). vocab 0.1.102 requires `ikigai-core ^0.1.101`, so the core this crate resolves
# with stays lifted to 0.1.101 transitively; the `ikigai-core` pin above stays at 0.1.100.
# 0.8.2: re-checked — 0.1.103 is the head on crates.io; raised to it (the RANGE >=0.1.103,
# <0.2.0). vocab 0.1.103 still requires `ikigai-core ^0.1.101`; the `ikigai-core` pin above
# stays at 0.1.100.
# 0.8.3: re-checked — 0.1.103 is still the head on crates.io; the pin stands unchanged.
# 0.8.4: re-checked — 0.1.103 is still the head on crates.io; the pin stands unchanged.
# 0.9.0: re-checked — 0.1.105 is the head on crates.io; raised to it (the RANGE >=0.1.105,
# <0.2.0). It matches the core floor above: vocab 0.1.105 requires `ikigai-core ^0.1.105`
# and defines the new contract terms (`ik:InputGroup`, `ik:group`, `ik:needs`, …), so a
# module whose faces emit them is not told they are invented.
# 0.9.1: re-checked — 0.1.106 is the head on crates.io; raised to it (the RANGE >=0.1.106,
# <0.2.0). It matches the core floor above.
# 0.10.0: re-checked — 0.1.108 is the head on crates.io; raised to it (the RANGE >=0.1.108,
# <0.2.0). It matches the core floor above, and defines `ik:mayFail`, `ik:FailureClass` and
# its seven individuals, so a module whose Meta face states its failure classes is not told
# they are invented.
# 0.11.0: re-checked — 0.2.0 is the head on crates.io; raised to it (the RANGE >=0.2.0,
# <0.3.0). It matches the core floor above.
# 0.12.0: re-checked — 0.2.4 is the newest published vocabulary; includes readsBody.
ikigai-vocab = "0.2.4"
# One parser for every RDF face a module can declare (Turtle, N-Triples, N-Quads,
# TriG, RDF/XML, JSON-LD). 0.2.5 is the version whose `for_slice` and
# `RdfFormat::from_media_type` this crate was written against.
oxrdfio = "0.2.5"
oxrdf = "0.3"
# The kernel is async and runtime-free; `check` is the one-line sync entry a
# `#[test]` wants, so it needs an executor. The futures executor is what every
# module's own tests already use.
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dev-dependencies]
async-trait = "0.1"
