[package]
name = "ikigai-conformance"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "What \"done\" means for an ikigai module, as one test: walks every endpoint a kernel binds and reports every violation of the module recipe at once — ArgSpec completeness, requires implies a verb, declared = enforced, declared outputs = served outputs, skolemized RDF faces, vocabulary terms only, the cacheable-twice probe, pipeline citizenship, a space's name is a claim (same name, same doors) — and says what it did NOT do: what it probed, what it could not, and which of your own declarations reached no check at all."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-conformance"
homepage = "https://github.com/ikigai-rs/ikigai-conformance"
readme = "README.md"
keywords = ["ikigai", "roc", "conformance", "testing", "module"]
categories = ["development-tools::testing"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the module under
# test links, so a host links exactly one `ikigai-core`. 0.1.67 is the API minimum:
# `Kernel::entries()` first listed the kernel's own `urn:kernel:*` operations there
# (#103), and the walk — and the tests that pin how it skips or includes them —
# depend on that shape. Everything else this crate reads (`issue_traced`,
# `describe_pattern`, `TraceEvent::cache_hit`, `Error::Denied`, `InputSource`)
# is older.
#
# 0.1.73 since the purity rule became "no thread but its own name" (ledger #549):
# from 0.1.73 the kernel hangs every cacheable `Source`/`Exists` answer on the
# thread named for its own canonical target, and the rule's exemption for an
# endpoint that takes writes through that name is right only because the kernel's
# auto-cut then reaches the cached read. Below 0.1.73 the exemption would pass a
# read that a write never invalidates. No API changed; the floor is a SEMANTIC one.
#
# 0.1.77 since 0.5.0, TRANSITIVELY: the vocab pin below tracks the head (0.1.84 then), and
# ikigai-vocab 0.1.84 declares `ikigai-core = "0.1.66"` while its lib.rs uses
# `Transreption::lossless` (core 0.1.77), so with core 0.1.73-0.1.76 it does not compile
# (E0609; reported to core as a vocab floor bug). Stating 0.1.77 here keeps a consumer's
# resolve from landing on that pair. Drop back to 0.1.73 once vocab states its own floor.
#
# 0.1.85 since 0.5.1, SEMANTIC again (ledger #756): from 0.1.85 a `requires` declared with
# no verb is enforced on every verb (ledger #750, A3). The REQUIRES-VERB finding's text and
# its test say so, which is true only on 0.1.85+; below it the scope is silently inert.
#
# 0.1.89 since 0.6.0, an API floor (ledger #987): SPACE-NAME calls `space_iri` and reads
# `SPACE_PREFIX`, both new in 0.1.89, which is also the release where binding a door onto
# a named `EndpointSpace` drops its name. Under 0.x caret rules this is the RANGE
# >=0.1.89, <0.2.0: a core 0.2 is a deliberate re-pin here, not a silent float.
ikigai-core = "0.1.89"
# The vocabulary is the ORACLE for the terms check: a predicate is "defined" iff it
# is a subject in `ikigai_vocab::VOCABULARY`. So the floor is the newest published
# vocabulary, not the oldest API this crate compiles against — an older pin would
# report terms that exist as invented.
#
# ⚠ STANDING RULE: **this pin tracks the vocabulary HEAD.** Raise it to the newest
# published `ikigai-vocab` in every release of this crate, whether or not anything
# here changed. It is load-bearing for DATA, not API — the crate uses only `NS` and
# `VOCABULARY`, both ancient, so no compile error will ever force it up and nothing
# will ever say it has gone stale. What a stale pin does instead: cargo unifies
# `ikigai-vocab` across the graph, so a module whose faces use a term the newest
# vocabulary defines fails VOCABULARY ("the vocabulary does not define ns#passcode")
# against a `vocabulary.ttl` that visibly defines it, and the only per-module
# workaround is an `ikigai-vocab` dev-dependency no line imports, added purely to
# lift this floor (ikigai-llm and ikigai-browse both carried one).
#
# 0.2.0: re-checked at release time — 0.1.69 IS the head (ikigai-core's workspace
# version and the newest in the registry index), so the pin stands unchanged.
# 0.4.0: re-checked — 0.1.70 is now the head in the registry index, so the pin is
# raised to it. This crate commits no lockfile, so a fresh resolve already took
# 0.1.70 through the old caret; raising the FLOOR is what stops a consumer with an
# older resolved vocabulary from being told a term it can see is invented.
# 0.5.0: re-checked — 0.1.84 is the head in the registry index; raised to it.
# 0.6.0: re-checked — 0.1.89 is the head in the registry index; raised to it.
ikigai-vocab = "0.1.89"
# One parser for every RDF face a module can declare (Turtle, N-Triples, N-Quads,
# TriG, RDF/XML, JSON-LD). 0.2.5 is the version whose `for_slice` and
# `RdfFormat::from_media_type` this crate was written against.
oxrdfio = "0.2.5"
oxrdf = "0.3"
# The kernel is async and runtime-free; `check` is the one-line sync entry a
# `#[test]` wants, so it needs an executor. The futures executor is what every
# module's own tests already use.
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dev-dependencies]
async-trait = "0.1"
